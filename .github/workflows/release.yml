name: release
on:
  push:
    tags: ["v*"]
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller
      - run: cd src && python -m faxdesk --selftest
      - run: cd src && python -m PyInstaller --noconfirm --onefile --noconsole --name FaxDesk --add-data "faxdesk\www;faxdesk\www" run_faxdesk.py
      - run: Compress-Archive -Path src\faxdesk, src\FaxDesk.command, src\README.txt, src\run_faxdesk.py -DestinationPath FreeFaxDesk-source.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src/dist/FaxDesk.exe
            FreeFaxDesk-source.zip
